<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MerwMc | Survival & PvP Sunucusu</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0c100e;
            --card-bg: #141c17;
            --primary: #2e8b57; /* Stihl / Doğa Yeşili */
            --primary-hover: #3cb371;
            --accent: #556b2f;
            --text-main: #f0f4f1;
            --text-muted: #9aa89e;
            --border-color: #223026;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #17261c 0%, var(--bg-color) 70%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto 0;
        }

        /* Header / Logo */
        header {
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .server-logo {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
            box-shadow: 0 10px 30px rgba(46, 139, 87, 0.3);
            margin: 0 auto 20px auto;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--primary-hover);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* IP Box */
        .ip-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px 30px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 35px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .ip-card:hover {
            border-color: var(--primary);
        }

        .ip-info {
            text-align: left;
        }

        .ip-info .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .ip-info .address {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 2px;
        }

        .copy-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .copy-btn:hover {
            background-color: var(--primary-hover);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        /* Links Grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .link-card i {
            font-size: 24px;
            color: var(--primary-hover);
        }

        .link-card:hover {
            background: #1b261f;
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(46, 139, 87, 0.15);
            border: 1px solid rgba(46, 139, 87, 0.4);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4ade80;
            margin-bottom: 25px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        footer {
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            width: 100%;
            text-align: center;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            background: #1b261f;
            color: #4ade80;
            border: 1px solid var(--primary);
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <header>
            <div class="server-logo">
                <i class="fa-solid fa-cube"></i>
            </div>
            <h1>Merw<span>Mc</span></h1>
            <p class="subtitle">Iň gowy Survival & PvP tejribesi üçin gatnaşyň!</p>
        </header>

        <!-- Sunucu Durumu -->
        <div class="status-badge">
            <div class="status-dot"></div>
            Sunucu Aktif • MaryMC
        </div>

        <!-- IP Kopyalama Kartı -->
        <div class="ip-card">
            <div class="ip-info">
                <div class="label">Sunucu IP Adresi</div>
                <div class="address" id="serverIP">marymc.play.hosting</div>
            </div>
            <button class="copy-btn" onclick="copyIP()">
                <i class="fa-regular fa-copy"></i> Göçür
            </button>
        </div>

        <!-- Hızlı Menü Kartları -->
        <div class="links-grid">
            <a href="https://discord.gg/senindiscordun" target="_blank" class="link-card">
                <i class="fa-brands fa-discord"></i>
                Discord
            </a>
            <a href="#market" class="link-card">
                <i class="fa-solid fa-store"></i>
                VIP Market
            </a>
            <a href="#rules" class="link-card">
                <i class="fa-solid fa-book-open"></i>
                Kadalar
            </a>
        </div>
    </div>

    <!-- Alt Bilgi -->
    <footer>
        &copy; 2026 MerwMc. Ähli hukuklar goralan. GitHub Pages arkaly işledilýär.
    </footer>

    <!-- Kopyalandı Bildirimi -->
    <div class="toast" id="toastMessage">
        <i class="fa-solid fa-circle-check"></i> IP adresi buferke göçürildi!
    </div>

    <script>
        function copyIP() {
            const ipText = document.getElementById("serverIP").innerText;
            navigator.clipboard.writeText(ipText).then(() => {
                const toast = document.getElementById("toastMessage");
                toast.classList.add("show");
                setTimeout(() => {
                    toast.classList.remove("show");
                }, 2000);
            });
        }
    </script>
</body>
</html>
